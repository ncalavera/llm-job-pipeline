[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Default rule set (pycodestyle errors + pyflakes). Kept deliberately
# non-aggressive so the whole codebase stays clean without behavior changes.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402", # module import not at top — scripts adjust sys.path before imports
    "E731", # lambda assignment — used intentionally in report helpers
    "E741", # ambiguous variable names (l, O) — existing short loop vars
    "F841", # unused local variables — some assignments are kept for side effects
]

[tool.ruff.lint.per-file-ignores]
# config.py is a re-export facade: "unused" imports are its public API.
"scripts/config.py" = ["F401"]
# Duplicate-source import (`X, X as Y`) trips ruff's F401 autofix into
# removing a binding that is still used further down the module.
"scripts/database_supabase.py" = ["F401"]
# Tests re-import modules locally inside test functions for clarity.
"tests/*" = ["F811"]
