# defaults.toml — tool mechanics + neutral "goldilocks" defaults.
#
# This file holds every tunable list, threshold, keyword, geo mapping and board
# definition the pipeline reads. Changing behavior means editing THIS file (or
# your config/user_profile.md), never editing Python. The loader is
# scripts/settings.py; scripts/config.py re-exports the same names it always did.
#
# Goldilocks rule: values here are neutral and owner-agnostic — they work for
# any job-seeker. Personal taste (target roles, excluded disciplines, excluded
# geographies) belongs in config/user_profile.md, NOT here. Every per-board
# `board_blacklist` ships empty; region keyword buckets ship empty; only
# universal non-job junk (talent pools, bootcamps, …) is filtered by default.
#
# Missing file / section / key is tolerated: the loader falls back to a
# documented neutral default and never crashes.

# ===========================================================================
# Dashboard — visual style of the generated public dashboard.
# ===========================================================================
[dashboard]
# Two styles only:
#   "illustrated" — full visuals: companion + accent illustrations (default).
#   "minimal"     — hides decorative illustrations for a clean, plain look.
# Env DASHBOARD_STYLE=illustrated|minimal overrides this. Any other value
# falls back to "illustrated".
style = "illustrated"

# UI language of the generated dashboard chrome (tabs, chips, placeholders,
# buttons, empty states). Bundled translations live in scripts/i18n.py.
# Shipped values: "en" (default), "ru". Env DASHBOARD_LANGUAGE overrides this.
# An unknown value falls back to "en".
language = "en"

# Illustration pack for the companion/accent images on each tab. "default" uses
# the generic art committed under public/images/. Any other name resolves its
# images from public/images/<pack>/ — a directory you can keep local-only
# (gitignored) for personal art. Env DASHBOARD_PACK overrides this.
illustration_pack = "default"

# Show the "MPA Prestige" column on the Companies table (and the matching profile
# metric). It is a personal MPA/MPP application-strategy score, so it ships OFF.
# Env DASHBOARD_MPA=1 overrides this. Set true to opt in.
show_mpa_column = false

# ===========================================================================
# Numeric thresholds — scoring, tiers, auto-archive, auto-review.
# ===========================================================================
[thresholds]
# Vacancies scored below this are auto-archived (only unseen ones; user
# decisions like liked/passed are kept). Env LLM_SCORE_THRESHOLD overrides.
# Set to 0 to disable auto-archive entirely.
llm_score_threshold = 20

# Score → tier cut-offs (highest first). S = best fit. Used by the dashboard /
# tier helpers; not a geography or discipline preference.
tier_s = 82
tier_a = 70
tier_b = 55
tier_c = 0

# Composite company-ranking weights (alignment vs. any boost). Neutral split.
composite_alignment_weight = 0.70
composite_boost_weight = 0.30

[thresholds.auto_review]
# Opt-in: auto-promote/reject candidate companies by alignment_score. Disabled
# by default (a human approves companies). Env AUTO_REVIEW_CANDIDATES=1 enables;
# AUTO_REVIEW_APPROVE / AUTO_REVIEW_REJECT override the numbers.
enabled = false
approve = 60
reject = 25

# ===========================================================================
# Universal junk — non-vacancy postings nobody is searching for.
#
# Contains NO geography and NO job discipline (no "engineer", "sales", …) —
# those are personal and live in user_profile.md's exclude_title_keywords.
# Safe to apply for everyone: these are simply not real open roles.
# ===========================================================================
[junk]
# Word-boundary matches against lower(title). ONLY speculative / evergreen
# "pipeline" entries that are not a specific open role at all. Nothing tied to
# discipline, seniority, career stage, format, geography or sector ships here:
# a student wants fellowships and internships; some people want to volunteer for
# experience; a career-changer wants a bootcamp. Those are personal taste →
# user_profile.md's exclude_title_keywords (empty by default). The test
# "imagine a student, a career-changer, anyone — would someone want this?" must
# be NO for every entry below.
words = [
    "expression of interest", "expressions of interest", "talent pool",
    "general application", "talent community", "speculative application",
    "future opportunities", "open application", "talent network",
    "join our talent", "talent connection", "general interest",
    "request for proposals", "request for proposal", "career advising",
    "now closed",
]

# Substring (stem) matches — no word boundaries. Ships EMPTY on purpose.
#
# Format- or discipline-flavored words (bootcamp, course, summer school,
# fellowship, internship, "training on", …) are NOT universal junk: a "Data
# Science Bootcamp" instructor or a paid fellowship can be a real role. Whether
# to drop them is personal taste → user_profile.md's exclude_title_keywords.
# Universal junk (the `words` list above) holds ONLY markers meaning "no
# concrete single role here at all" (talent pool, expression of interest,
# general/open/speculative application, talent network/community, volunteer
# call). Keep this list empty unless a future pattern is a non-job for everyone.
substr = []

# Description-level kill phrases (substring vs. full_description). Kept narrow —
# visa/citizenship boilerplate only — to avoid false positives.
desc_substr = [
    "visa sponsorship not available",
    "must be a us citizen",
    "must be us citizen",
]

# ===========================================================================
# Region keyword buckets — used only to stamp the display-only `region` field.
# Ship EMPTY so NO geography is privileged as a "good region" by default.
# Geography preference comes from user_profile.md's exclude_countries.
# ===========================================================================
[regions]
europe = []
us = []
remote = []

