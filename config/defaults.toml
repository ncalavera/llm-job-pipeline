# ===========================================================================
# Parsing heuristics — pure extraction hints (NOT filters).
# ===========================================================================
[parsing]
# Cities the markdown location-extractor looks for near a job link to pull a
# location substring out of free text. This only EXTRACTS a value; it never
# drops a job. Broaden it for your own geographies as needed.
location_hint_cities = [
    "Berlin", "London", "Lisbon", "Munich", "Paris", "Geneva", "Amsterdam",
    "Brussels", "Dublin", "New York", "Washington", "San Francisco", "NYC",
    "DC", "UK", "Germany", "Portugal", "US", "USA", "Europe", "EMEA", "Remote",
]

# ===========================================================================
# Telegram digest — defaults for the optional daily digest. Env vars still win
# (DIGEST_HOT_SCORE, DIGEST_DEADLINE_SOON_DAYS, DIGEST_LIMIT, DIGEST_MIN_SCORE).
# ===========================================================================
[digest]
hot_vacancy_score = 55
deadline_soon_days = 7
default_limit = 5
default_min_score = 40
summary_fallback_chars = 600
summary_max_chars = 1500
message_max_chars = 4000

