# LinkedIn — public guest jobs API (free, no login). A GENERAL board: it fits
# ANY field because its search queries are derived from the user profile (target
# roles + geography), not baked here. Resolution order, in
# scripts/profile_targeting.py: an explicit ## LINKEDIN_QUERIES profile section
# wins; else queries are derived from ## TARGET_ROLES (+ target geography); else
# the board fetches nothing and says how to fix it. The shipped config carries NO
# queries on purpose (STRATEGY guardrail 1: no maintainer taste in defaults).
# LinkedIn throttles hard — keep pages low and request_delay generous.
[boards.linkedin]
strategy = "linkedin_guest"
name = "LinkedIn"
url = "https://www.linkedin.com/jobs"
board_blacklist = []
ttl_days = 3
tier = "B"
free = true
pages = 2
request_delay = 3.0
fetch_detail = true
general = true
audience = "Any field — queries are built from your profile's target roles + geography."

