strategy = "hn_whoishiring"
name = "HN Who is hiring"
url = "https://news.ycombinator.com/submitted?id=whoishiring"
board_blacklist = []
# The thread is monthly — a 30-day TTL stops daily refetches.
ttl_days = 30
tier = "C"
free = true

# Impactpool — server-rendered HTML scrape (free, no key). Listing-only; the
# enrich pass fills full descriptions later. Nonprofit / multilateral focus.
[boards.impactpool]
strategy = "impactpool_html"
name = "Impactpool"
url = "https://www.impactpool.org/search"
max_pages = 5
board_blacklist = []
ttl_days = 3
tier = "B"
free = true

# data.org — WordPress aggregator (free, no key). Each posting links out to the
# real employer's ATS, so vacancies are attributed to that employer (not data.org)
# and the external apply URL is stored. Data-for-social-impact / AI-for-good focus.
[boards.datadotorg]
strategy = "datadotorg_wp"
name = "data.org"
url = "https://data.org/jobs/"
api_url = "https://data.org/wp-json/wp/v2/job"
max_jobs = 60
request_delay = 0.4
board_blacklist = []
ttl_days = 3
tier = "B"
free = true

# Idealist — nonprofit/impact jobs via the public Algolia search key embedded in
# idealist.org. remote_zone=WORLD keeps only globally-open remote roles.
[boards.idealist]
strategy = "idealist_algolia"
name = "Idealist"
url = "https://www.idealist.org/en/jobs"
remote_zone = "WORLD"
max_pages = 20
board_blacklist = []
ttl_days = 2
tier = "B"
free = true

# Fast Forward — tech-nonprofit board on Getro (collection 997). Listing-only by
# default (fetch_descriptions=false) so a run does not make ~1.5k detail calls.
[boards.fast_forward]
strategy = "fastforward_board"
name = "Fast Forward"
url = "https://jobs.ffwd.org/jobs"
getro_collection_id = 997
max_pages = 20
fetch_descriptions = false
board_blacklist = []
ttl_days = 2
tier = "B"
free = true

# LinkedIn — public guest jobs API (free, no login). Merges the old "LinkedIn" +
# "LinkedIn Non-profits" sources: the nonprofit slant is just extra queries.
# LinkedIn throttles hard — keep pages low and request_delay generous.
[boards.linkedin]
strategy = "linkedin_guest"
name = "LinkedIn"
url = "https://www.linkedin.com/jobs"
board_blacklist = []
ttl_days = 3
tier = "B"
free = true
pages = 2
request_delay = 3.0
fetch_detail = true
queries = [
  { keywords = "Chief of Staff", location = "London" },
  { keywords = "Chief of Staff", location = "European Union" },
  { keywords = "Head of Operations", location = "London" },
  { keywords = "Director of Operations", location = "Berlin" },
  { keywords = "Programme Manager", location = "London" },
  { keywords = "Program Manager", location = "European Union" },
  { keywords = "Product Manager impact", location = "Remote" },
  { keywords = "Chief of Staff nonprofit", location = "London" },
  { keywords = "Programme Manager nonprofit", location = "European Union" },
  { keywords = "Head of Programmes foundation", location = "London" },
]

# Consider portfolio boards (a16z, Sequoia) — VC job aggregators. Defined here so
# they appear in the dashboard's Boards tab, but OFF by default (not in
# JOB_BOARDS): past runs found ~0 mission-fit roles. The consider_board fetcher
# is not implemented in this repo, so do not enable these without restoring it.
[boards.a16z]
strategy = "consider_board"
name = "a16z Portfolio"
url = "https://jobs.a16z.com"
board_blacklist = []
ttl_days = 3
tier = "B"
free = true

[boards.sequoia]
strategy = "consider_board"
name = "Sequoia Portfolio"
url = "https://jobs.sequoiacap.com"
board_blacklist = []
ttl_days = 3
tier = "B"
free = true
