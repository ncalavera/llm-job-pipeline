<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Job Pipeline — Get Started</title>
    <meta
      name="description"
      content="Set up your own AI-powered job search pipeline. Answer a few questions, copy one prompt, paste it into your coding agent."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #ffffff;
        --card: #f5f6f7;
        --ink: #16181d;
        --soft: #4d525a;
        --fg3: #697078;
        --line: #e3e5e8;
        --rule: #c4c8cd;
        --navy: #1b2a4a;
        --navy-deep: #13203a;
        --navy-tint: #eceff5;
        --ok: #3d614d;
        --disp: "Source Serif 4", Georgia, serif;
        --body: "Source Sans 3", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font: 400 16px/1.6 var(--body);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      ::selection {
        background: var(--navy);
        color: #fff;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: clamp(28px, 5vw, 56px) 24px 90px;
      }

      /* ---- top bar ---- */
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 48px;
      }
      .brand {
        font: 600 11px/1 var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg3);
      }
      .brand a {
        color: var(--navy);
        text-decoration: none;
      }
      .brand a:hover {
        color: var(--navy-deep);
      }
      .lang {
        display: flex;
        gap: 2px;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px;
        background: var(--paper);
      }
      .lang button {
        border: none;
        background: transparent;
        padding: 5px 12px;
        border-radius: 3px;
        font: 600 11px/1 var(--mono);
        letter-spacing: 0.08em;
        cursor: pointer;
        color: var(--fg3);
      }
      .lang button.on {
        background: var(--navy);
        color: #fff;
      }

      /* ---- masthead ---- */
      .kicker {
        font: 600 11px/1 var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg3);
        margin: 0 0 22px;
      }
      h1 {
        font: 600 clamp(30px, 5.6vw, 44px)/1.12 var(--disp);
        letter-spacing: -0.015em;
        margin: 0 0 18px;
        max-width: 18ch;
      }
      .dek {
        font: 400 18px/1.5 var(--body);
        color: var(--soft);
        margin: 0;
        max-width: 56ch;
      }
      .byline {
        font: 500 11px/1.6 var(--mono);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--fg3);
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        padding: 14px 0;
        margin: 34px 0 0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 36px;
      }
      .byline b {
        color: var(--ink);
        font-weight: 600;
      }

      /* ---- three steps ---- */
      .steps {
        margin: 40px 0 8px;
        border-top: 1px solid var(--line);
      }
      .steprow {
        display: flex;
        gap: 22px;
        align-items: baseline;
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
      }
      .steprow .n {
        font: 600 11.5px/1 var(--mono);
        color: var(--navy);
        letter-spacing: 0.1em;
        min-width: 54px;
        flex: none;
      }
      .steprow b {
        font: 600 16px/1.35 var(--body);
        color: var(--ink);
        display: block;
        margin-bottom: 2px;
      }
      .steprow span.d {
        color: var(--soft);
        font-size: 14.5px;
      }

      .startrow {
        margin: 34px 0 6px;
      }
      button.big {
        font: 600 15px/1 var(--body);
        border: none;
        border-radius: 6px;
        padding: 15px 30px;
        cursor: pointer;
        background: var(--navy);
        color: #fff;
        transition: background 0.12s;
        letter-spacing: 0.01em;
      }
      button.big:hover {
        background: var(--navy-deep);
      }

      /* ---- wizard ---- */
      #wizard {
        display: none;
        margin-top: 36px;
      }
      #wizard.show {
        display: block;
      }
      .progress {
        height: 3px;
        background: var(--line);
        margin-bottom: 26px;
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--navy);
        transition: width 0.25s;
      }
      .qcard {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 30px 32px 24px;
        min-height: 240px;
        display: flex;
        flex-direction: column;
      }
      .qnum {
        font: 600 11px/1 var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--navy);
        margin-bottom: 12px;
      }
      .qtitle {
        font: 600 clamp(21px, 3.4vw, 26px)/1.15 var(--disp);
        letter-spacing: -0.01em;
        margin-bottom: 8px;
      }
      .qhint {
        color: var(--soft);
        font-size: 14.5px;
        margin-bottom: 18px;
        max-width: 58ch;
      }
      .qbody {
        flex: 1;
      }
      input[type="text"],
      textarea,
      select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--rule);
        border-radius: 6px;
        font: inherit;
        font-size: 15px;
        background: var(--paper);
        color: var(--ink);
      }
      textarea {
        min-height: 112px;
        resize: vertical;
        line-height: 1.5;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: 2px solid var(--navy);
        outline-offset: -1px;
        border-color: transparent;
      }
      .pair > * + * {
        margin-top: 14px;
      }
      .modecards {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      .modecard {
        flex: 1 1 240px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--paper);
        padding: 18px 20px;
        cursor: pointer;
        transition:
          border-color 0.12s,
          box-shadow 0.12s;
      }
      .modecard:hover {
        border-color: var(--fg3);
      }
      .modecard.sel {
        border-color: var(--navy);
        box-shadow: 0 0 0 1px var(--navy);
      }
      .modecard h4 {
        font: 600 17px/1.3 var(--disp);
        margin-bottom: 2px;
      }
      .modecard .tagline {
        font: 600 10.5px/1 var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--navy);
        display: block;
        margin-bottom: 10px;
      }
      .modecard ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .modecard li {
        font-size: 13.5px;
        color: var(--soft);
        padding: 3px 0 3px 18px;
        position: relative;
      }
      .modecard li::before {
        content: "+";
        position: absolute;
        left: 0;
        color: var(--ok);
        font-weight: 700;
      }
      .modecard li.minus::before {
        content: "−";
        color: #7c3a36;
      }
      .sublabel {
        font: 600 10.5px/1 var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 7px;
        color: var(--fg3);
      }
      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 22px;
      }
      .nav .right {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      button.next {
        font: 600 14px/1 var(--body);
        border: none;
        border-radius: 6px;
        padding: 13px 26px;
        cursor: pointer;
        background: var(--navy);
        color: #fff;
        transition: background 0.12s;
      }
      button.next:hover {
        background: var(--navy-deep);
      }
      button.back,
      button.skip {
        font: 500 13px/1 var(--body);
        border: none;
        background: transparent;
        color: var(--fg3);
        cursor: pointer;
        padding: 13px 6px;
      }
      button.back:hover,
      button.skip:hover {
        color: var(--ink);
      }
      .enterhint {
        font: 500 10px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg3);
      }
      .req-warn {
        color: #7c3a36;
        font-size: 14px;
        margin-top: 10px;
        display: none;
        font-weight: 600;
      }

      /* ---- result ---- */
      #result {
        display: none;
        margin-top: 40px;
      }
      #result.show {
        display: block;
      }
      .result-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 26px 28px;
        margin-bottom: 18px;
      }
      .result-card h3 {
        font: 600 21px/1.2 var(--disp);
        letter-spacing: -0.01em;
        margin-bottom: 8px;
      }
      .result-card p {
        color: var(--soft);
        font-size: 14.5px;
        margin-bottom: 16px;
        max-width: 62ch;
      }
      .result-card a {
        color: var(--navy);
      }
      pre {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 16px;
        font: 400 11.5px/1.55 var(--mono);
        max-height: 260px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        margin-bottom: 16px;
        color: var(--soft);
      }
      .copied {
        color: var(--ok);
        font-size: 14px;
        margin-left: 10px;
        font-weight: 600;
      }
      button.ghost {
        font: 600 14px/1 var(--body);
        border-radius: 6px;
        padding: 13px 24px;
        cursor: pointer;
        background: var(--paper);
        border: 1px solid var(--rule);
        color: var(--ink);
      }
      button.ghost:hover {
        border-color: var(--fg3);
      }
      button.primary {
        font: 600 14px/1 var(--body);
        border: none;
        border-radius: 6px;
        padding: 13px 24px;
        cursor: pointer;
        background: var(--navy);
        color: #fff;
      }
      button.primary:hover {
        background: var(--navy-deep);
      }

      footer {
        margin-top: 70px;
        color: var(--fg3);
        font-size: 14px;
        border-top: 1px solid var(--rule);
        padding-top: 18px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
      }
      footer a {
        color: var(--navy);
      }
      footer .mono {
        font: 500 10px/1.8 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <div class="brand">
          <a href="https://github.com/ncalavera/llm-job-pipeline"
            >llm-job-pipeline</a
          >
        </div>
        <div class="lang">
          <button id="lang-en" class="on" onclick="setLang('en')">EN</button>
          <button id="lang-ru" onclick="setLang('ru')">RU</button>
        </div>
      </div>

      <header>
        <p class="kicker" data-i18n="kicker"></p>
        <h1 data-i18n="title"></h1>
        <p class="dek" data-i18n="lead"></p>
        <div class="byline">
          <span data-i18n="by1"></span>
          <span data-i18n="by2"></span>
          <span data-i18n="by3"></span>
        </div>
      </header>

      <div class="steps">
        <div class="steprow">
          <span class="n" data-i18n="n1"></span>
          <div>
            <b data-i18n="s1t"></b><span class="d" data-i18n="s1d"></span>
          </div>
        </div>
        <div class="steprow">
          <span class="n" data-i18n="n2"></span>
          <div>
            <b data-i18n="s2t"></b><span class="d" data-i18n="s2d"></span>
          </div>
        </div>
        <div class="steprow">
          <span class="n" data-i18n="n3"></span>
          <div>
            <b data-i18n="s3t"></b><span class="d" data-i18n="s3d"></span>
          </div>
        </div>
      </div>

      <div class="startrow">
        <button
          class="big"
          id="startBtn"
          data-i18n="start"
          onclick="startWizard()"
        ></button>
      </div>

      <div id="wizard">
        <div class="progress"><i id="bar" style="width: 0%"></i></div>
        <div class="qcard">
          <div class="qnum" id="qnum"></div>
          <div class="qtitle" id="qtitle"></div>
          <div class="qhint" id="qhint"></div>
          <div class="qbody" id="qbody"></div>
          <div class="req-warn" id="reqwarn" data-i18n="required"></div>
          <div class="nav">
            <button
              class="back"
              id="backBtn"
              data-i18n="back"
              onclick="prevQ()"
            ></button>
            <div class="right">
              <span class="enterhint" id="enterhint"></span>
              <button
                class="skip"
                id="skipBtn"
                data-i18n="skip"
                onclick="nextQ(true)"
              ></button>
              <button class="next" id="nextBtn" onclick="nextQ()"></button>
            </div>
          </div>
        </div>
      </div>

      <div id="result">
        <div class="result-card">
          <h3 data-i18n="r1t"></h3>
          <p data-i18n="r1d"></p>
          <pre id="promptOut"></pre>
          <button class="primary" id="copyPrompt" data-i18n="copy"></button>
          <button class="ghost" id="dlPrompt" data-i18n="download"></button>
          <span class="copied" id="copiedMark"></span>
        </div>
        <div class="result-card">
          <h3 data-i18n="r2t"></h3>
          <p id="r2body"></p>
        </div>
      </div>

      <footer>
        <span data-i18n="footer"></span>
        <span class="mono"
          ><a href="https://github.com/ncalavera/llm-job-pipeline">GitHub</a> ·
          MIT · company-first</span
        >
      </footer>
    </div>

    <script>
      // ---------------------------------------------------------------- i18n
      const I18N = {

      // ---------------------------------------------------------------- questions
      const QUESTIONS = [
        {
          id: "mode",

        {

          en: {

      // ---------------------------------------------------------------- state
      let lang = "en";
      let cur = 0;
      const answers = {};

      function t(key) {
        return I18N[lang][key];
      }

      function setLang(l) {
        lang = l;
        document.documentElement.lang = l;
        document.getElementById("lang-en").classList.toggle("on", l === "en");
        document.getElementById("lang-ru").classList.toggle("on", l === "ru");
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const val = I18N[l][el.dataset.i18n];
          if (typeof val === "string") el.innerHTML = val;
        });
        document.getElementById("r2body").innerHTML = I18N[l].r2body;
        document.getElementById("enterhint").textContent = I18N[l].enterhint;
        if (document.getElementById("wizard").classList.contains("show"))
          renderQ();
        if (document.getElementById("result").classList.contains("show")) {
          document.getElementById("promptOut").textContent = buildPrompt();
        }
      }

      function startWizard() {
        document.getElementById("wizard").classList.add("show");
        document.getElementById("startBtn").style.display = "none";
        renderQ();
        document
          .getElementById("wizard")
          .scrollIntoView({ behavior: "smooth" });
      }

      function saveCurrent() {
        const q = QUESTIONS[cur];
        if (q.type === "mode") {
          // saved on click; default to easy
          answers.mode = answers.mode || "easy";
        } else if (q.type === "pair" || q.type === "selects") {
          answers[q.id] = { a: val("w_a"), b: val("w_b") };
        } else {
          answers[q.id] = val("w_main");
        }
      }
      function pickMode(m) {
        answers.mode = m;
        document
          .querySelectorAll(".modecard")
          .forEach((el) => el.classList.toggle("sel", el.dataset.mode === m));
      }
      function val(id) {
        const el = document.getElementById(id);
        return el ? el.value.trim() : "";
      }

      function isAnswered(q) {
        const a = answers[q.id];
        if (a == null) return false;
        if (typeof a === "string") return a !== "";
        return (a.a || "") !== "" || (a.b || "") !== "";
      }

      function renderQ() {
        const q = QUESTIONS[cur];
        const L = q[lang];
        document.getElementById("bar").style.width =
          Math.round((cur / QUESTIONS.length) * 100) + "%";
        document.getElementById("qnum").textContent = I18N[lang].qof(
          cur + 1,
          QUESTIONS.length,
        );
        document.getElementById("qtitle").textContent = L.t;
        document.getElementById("qhint").textContent = L.h;
        document.getElementById("reqwarn").style.display = "none";
        const body = document.getElementById("qbody");
        const saved = answers[q.id];

        if (q.type === "text") {
          body.innerHTML = `<input type="text" id="w_main" placeholder="${esc(L.ph)}">`;
          document.getElementById("w_main").value =
            typeof saved === "string" ? saved : "";
        } else if (q.type === "textarea") {
          body.innerHTML = `<textarea id="w_main" placeholder="${esc(L.ph)}"></textarea>`;
          document.getElementById("w_main").value =
            typeof saved === "string" ? saved : "";
        } else if (q.type === "pair") {
          body.innerHTML = `<div class="pair">
      <div><div class="sublabel">${esc(L.a)}</div><input type="text" id="w_a" placeholder="${esc(L.aph)}"></div>
      <div><div class="sublabel">${esc(L.b)}</div><input type="text" id="w_b" placeholder="${esc(L.bph)}"></div>
    </div>`;
          if (saved) {
            document.getElementById("w_a").value = saved.a || "";
            document.getElementById("w_b").value = saved.b || "";
          }
        } else if (q.type === "selects") {
          const opts = (arr, sel) =>
            arr
              .map(
                ([v, lab]) =>
                  `<option value="${esc(v)}"${v === sel ? " selected" : ""}>${esc(lab)}</option>`,
              )
              .join("");
          body.innerHTML = `<div class="pair">
      <div><div class="sublabel">${esc(L.a)}</div><select id="w_a">${opts(L.aopts, saved && saved.a)}</select></div>
      <div><div class="sublabel">${esc(L.b)}</div><select id="w_b">${opts(L.bopts, saved && saved.b)}</select></div>
    </div>`;
        } else if (q.type === "mode") {
          const card = (key, m) => {
            const items = m.items
              .map((it) =>
                Array.isArray(it)
                  ? `<li class="minus">${esc(it[1])}</li>`
                  : `<li>${esc(it)}</li>`,
              )
              .join("");
            return `<div class="modecard${(answers.mode || "easy") === key ? " sel" : ""}" data-mode="${key}" onclick="pickMode('${key}')">
        <h4>${esc(m.name)}</h4><span class="tagline">${esc(m.tag)}</span><ul>${items}</ul></div>`;
          };
          body.innerHTML = `<div class="modecards">${card("easy", L.easy)}${card("full", L.full)}</div>`;
        }

        document.getElementById("backBtn").style.visibility =
          cur === 0 ? "hidden" : "visible";
        document.getElementById("skipBtn").style.display = q.req
          ? "none"
          : "inline-block";
        document.getElementById("nextBtn").textContent =
          cur === QUESTIONS.length - 1 ? t("finish") : t("next");
        document.getElementById("enterhint").textContent = t("enterhint");

        const first = body.querySelector("input, textarea, select");
        if (first) first.focus();
        body.querySelectorAll("input").forEach((el) =>
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              nextQ();
            }
          }),
        );
        body.querySelectorAll("textarea").forEach((el) =>
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
              e.preventDefault();
              nextQ();
            }
          }),
        );
      }

      function esc(s) {
        return (s || "")
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;");
      }

      function nextQ(skipping) {
        const q = QUESTIONS[cur];
        saveCurrent();
        if (q.req && !skipping && !isAnswered(q)) {
          document.getElementById("reqwarn").style.display = "block";
          return;
        }
        if (cur === QUESTIONS.length - 1) {
          finish();
          return;
        }
        cur++;
        renderQ();
      }

      function prevQ() {
        saveCurrent();
        if (cur > 0) {
          cur--;
          renderQ();
        }
      }

      function finish() {
        document.getElementById("bar").style.width = "100%";
        document.getElementById("wizard").classList.remove("show");
        document.getElementById("startBtn").style.display = "inline-block";
        document.getElementById("startBtn").textContent =
          lang === "ru" ? "Изменить ответы" : "Edit answers";
        const r = document.getElementById("result");
        document.getElementById("promptOut").textContent = buildPrompt();
        r.classList.add("show");
        r.scrollIntoView({ behavior: "smooth" });
      }

      // ---------------------------------------------------------------- output
      function asLines(s) {
        return (s || "")
          .split(/\n|,(?![^()]*\))/)
          .map((x) => x.trim())
          .filter(Boolean);
      }

      function buildProfile() {
        const name = answers.name || "Anonymous Candidate";
        const exp =
          asLines(answers.exp)
            .map((s) => "- " + s)
            .join("\n") || "- (fill in your experience)";
        const skills =
          asLines(answers.skills)
            .map((s) => "- " + s)
            .join("\n") || "- (fill in your skills)";
        const energy = (answers.energy || "").trim();
        const roles =
          asLines(answers.roles)
            .map((s) => "- " + s)
            .join("\n") || "- (fill in target roles)";
        const domains = (answers.domains || "").trim() || "(any)";
        const anti =
          asLines(answers.antiroles)
            .map((s) => "- " + s)
            .join("\n") || "- (none)";
        const locs = answers.locs || {};
        const vw = answers.visa_when || {};
        const outLang = lang === "ru" ? "Russian" : "English";

        return `# User profile

## USER_PROFILE

**Name:** ${name}
**Current location:** ${locs.a || "(not specified)"}
**Target locations:** ${locs.b || "(not specified)"}
**Target start:** ${vw.b || "within 3–6 months"}
**Salary benchmark:** ${answers.salary || "(not specified)"}
**Visa status:** ${vw.a || "No sponsorship needed in my target locations."}

### Professional experience

${exp}

### Core skills (in priority order)

${skills}
${
  energy
    ? `
### What energises you

${energy}
`
    : ""
}
### Domain preferences

**Want to work in:** ${domains}

## TARGET_ROLES

${roles}

**Not a target:** see exclude patterns below.

## EXCLUDE_PATTERNS

These reduce the score by -15 to -25 even when the title superficially matches:

${anti}

## SHORT_SUMMARY_INSTRUCTION

A 4–6 sentence factual summary in **${outLang}** for the dashboard card.
Include: gist of the role and key responsibilities, required experience
and skills, seniority level, location and work mode, salary if mentioned,
and team/department if disclosed. Write factually, no candidate-fit
opinions.

## OUTPUT_LANGUAGE

${outLang}

## ABOUT_INSTRUCTION

5–8 sentences describing the company: mission, main lines of work, scale
and reach.

## CUSTOM_CRITERION_LABEL

Career narrative value

## CUSTOM_CRITERION_DESCRIPTION

How does this org look on your CV in 2 years? Reputable brand, growing
field, story you can tell at the next interview?

## CUSTOM_BOOST_FIELD

career_narrative_boost
`;
      }

      }

      document

        .addEventListener("click", async () => {

          setTimeout(

        });

      document.getElementById("dlPrompt").addEventListener("click", () => {
        const blob = new Blob([buildPrompt()], { type: "text/markdown" });
        const a = document.createElement("a");

        a.download = "job-pipeline-setup-prompt.md";
        a.click();
        URL.revokeObjectURL(a.href);

      setLang(/^ru/i.test(navigator.language || "") ? "ru" : "en");
