<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Vacancy Dashboard</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22sk%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23F5F0E8%22/%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23EDE5D8%22/%3E%0A%20%20%20%20%3C/linearGradient%3E%0A%20%20%3C/defs%3E%0A%20%20%3C%21--%20skull%20shape%20--%3E%0A%20%20%3Cpath%20d%3D%22M16%202C9.5%202%205%207%205%2013c0%203.5%201.2%205.8%203%207.5V24c0%201%20.8%202%202%202h1v2.5c0%20.8.7%201.5%201.5%201.5h1c.8%200%201.5-.7%201.5-1.5V26h2v2.5c0%20.8.7%201.5%201.5%201.5h1c.8%200%201.5-.7%201.5-1.5V26h1c1.2%200%202-1%202-2v-3.5c1.8-1.7%203-4%203-7.5C27%207%2022.5%202%2016%202z%22%20fill%3D%22url%28%23sk%29%22%20stroke%3D%22%23C2522A%22%20stroke-width%3D%221%22/%3E%0A%20%20%3C%21--%20left%20eye%20--%3E%0A%20%20%3Cellipse%20cx%3D%2212%22%20cy%3D%2213%22%20rx%3D%222.8%22%20ry%3D%223%22%20fill%3D%22%23C2522A%22/%3E%0A%20%20%3Cellipse%20cx%3D%2212%22%20cy%3D%2212.5%22%20rx%3D%221.2%22%20ry%3D%221.4%22%20fill%3D%22%23F5F0E8%22/%3E%0A%20%20%3C%21--%20right%20eye%20--%3E%0A%20%20%3Cellipse%20cx%3D%2220%22%20cy%3D%2213%22%20rx%3D%222.8%22%20ry%3D%223%22%20fill%3D%22%23C2522A%22/%3E%0A%20%20%3Cellipse%20cx%3D%2220%22%20cy%3D%2212.5%22%20rx%3D%221.2%22%20ry%3D%221.4%22%20fill%3D%22%23F5F0E8%22/%3E%0A%20%20%3C%21--%20nose%20--%3E%0A%20%20%3Cpath%20d%3D%22M15%2017.5l1-2%201%202z%22%20fill%3D%22%23C2522A%22/%3E%0A%20%20%3C%21--%20teeth%20--%3E%0A%20%20%3Crect%20x%3D%2212%22%20y%3D%2220%22%20width%3D%221.5%22%20height%3D%222%22%20rx%3D%22.3%22%20fill%3D%22%23C2522A%22/%3E%0A%20%20%3Crect%20x%3D%2214.5%22%20y%3D%2220%22%20width%3D%221.5%22%20height%3D%222%22%20rx%3D%22.3%22%20fill%3D%22%23C2522A%22/%3E%0A%20%20%3Crect%20x%3D%2217%22%20y%3D%2220%22%20width%3D%221.5%22%20height%3D%222%22%20rx%3D%22.3%22%20fill%3D%22%23C2522A%22/%3E%0A%20%20%3C%21--%20forehead%20flower%20--%3E%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%227.5%22%20r%3D%221.6%22%20fill%3D%22%23F97316%22%20opacity%3D%22.85%22/%3E%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%227.5%22%20r%3D%22.6%22%20fill%3D%22%23D97706%22/%3E%0A%20%20%3C%21--%20brow%20decorations%20--%3E%0A%20%20%3Ccircle%20cx%3D%229.5%22%20cy%3D%229%22%20r%3D%22.7%22%20fill%3D%22%23F97316%22%20opacity%3D%22.6%22/%3E%0A%20%20%3Ccircle%20cx%3D%2222.5%22%20cy%3D%229%22%20r%3D%22.7%22%20fill%3D%22%23F97316%22%20opacity%3D%22.6%22/%3E%0A%3C/svg%3E"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- ============ SIDEBAR (U3, DHA-387) ============
           Desktop (>=900px): full sidebar, sub-items expanded inline.
           Narrow (<900px): collapses to an icon rail via CSS; the active
           section's sub-items appear instead as the pill row below
           (vacancySubNav — Applications' own sub-nav was removed, post-ship
           fast fix), same as before U3. -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <div class="sidebar-brand-mark">JP</div>
          <div class="nav-label sidebar-brand-name">Job Pipeline</div>
        </div>

        <div class="sidebar-search-wrap">
          <span class="sidebar-search-icon" aria-hidden="true"
            ><svg width="12" height="12" viewBox="0 0 12 12">
              <circle
                cx="5"
                cy="5"
                r="3.5"
                fill="none"
                stroke="#8A867C"
                stroke-width="1.4"
              ></circle>
              <line
                x1="8"
                y1="8"
                x2="11"
                y2="11"
                stroke="#8A867C"
                stroke-width="1.4"
              ></line></svg
          ></span>
          <input
            type="text"
            class="sidebar-search"
            id="sidebarSearch"
            readonly
            data-i18n-ph="nav_search"
            placeholder="Search"
          />
          <span class="sidebar-search-kbd" aria-hidden="true">&#8984;K</span>
        </div>

        <nav class="sidebar-nav">
          <button
            type="button"
            class="nav-item"
            id="navToday"
            data-section="today"
            onclick="switchMode('today')"
          >
            <span class="nav-icon" aria-hidden="true"
              ><svg width="15" height="15" viewBox="0 0 14 14">
                <circle cx="7" cy="7" r="3.2" fill="#C99A2C"></circle>
                <line
                  x1="7"
                  y1="0.8"
                  x2="7"
                  y2="2.6"
                  stroke="#C99A2C"
                  stroke-width="1.5"
                  stroke-linecap="round"
                ></line>
                <line
                  x1="7"
                  y1="11.4"
                  x2="7"
                  y2="13.2"
                  stroke="#C99A2C"
                  stroke-width="1.5"
                  stroke-linecap="round"
                ></line>
                <line
                  x1="0.8"
                  y1="7"
                  x2="2.6"
                  y2="7"
                  stroke="#C99A2C"
                  stroke-width="1.5"
                  stroke-linecap="round"
                ></line>
                <line
                  x1="11.4"
                  y1="7"
                  x2="13.2"
                  y2="7"
                  stroke="#C99A2C"
                  stroke-width="1.5"
                  stroke-linecap="round"
                ></line></svg
            ></span>
            <span class="nav-label" data-i18n="tab_today">Today</span>
          </button>

          <button
            type="button"
            class="nav-item"
            id="navVacancies"
            data-section="vacancies"
            onclick="switchVacancies()"
          >
            <span class="nav-icon" aria-hidden="true"
              ><svg width="15" height="15" viewBox="0 0 14 14">
                <rect
                  x="1.5"
                  y="2"
                  width="11"
                  height="2.6"
                  rx="1.3"
                  fill="#2545D3"
                ></rect>
                <rect
                  x="1.5"
                  y="6"
                  width="11"
                  height="2.6"
                  rx="1.3"
                  fill="#2545D3"
                  opacity=".6"
                ></rect>
                <rect
                  x="1.5"
                  y="10"
                  width="7"
                  height="2.6"
                  rx="1.3"
                  fill="#2545D3"
                  opacity=".35"
                ></rect></svg
            ></span>
            <span class="nav-label" data-i18n="tab_vacancies">Vacancies</span>
            <span
              class="nav-count nav-count--cobalt"
              id="navCountVacancies"
            ></span>
          </button>
          <div class="nav-subitems" id="navSubVacancies">
            <button
              type="button"
              class="nav-subitem"
              id="navSubBrowse"
              onclick="switchMode('catalog')"
            >
              <span class="nav-label" data-i18n="vsub_browse">Browse</span>
            </button>
            <button
              type="button"
              class="nav-subitem"
              id="navSubGeo"
              onclick="switchMode('stats')"
            >
              <span class="nav-label" data-i18n="tab_geo">Geo</span>
            </button>
            <button
              type="button"
              class="nav-subitem"
              id="navSubArchive"
              onclick="switchMode('archive')"
            >
              <span class="nav-label" data-i18n="tab_archive">Archive</span>
            </button>
          </div>

          <button
            type="button"
            class="nav-item"
            id="navCompanies"
            data-section="companies"
            onclick="switchMode('companies')"
          >
            <span class="nav-icon" aria-hidden="true"
              ><svg width="15" height="15" viewBox="0 0 14 14">
                <rect
                  x="1.8"
                  y="4"
                  width="4.6"
                  height="8.5"
                  rx="1.3"
                  fill="#0E7A55"
                  opacity=".85"
                ></rect>
                <rect
                  x="7.6"
                  y="1.5"
                  width="4.6"
                  height="11"
                  rx="1.3"
                  fill="#0E7A55"
                ></rect></svg
            ></span>
            <span class="nav-label" data-i18n="tab_companies">Companies</span>
            <span class="nav-count" id="navCountCompanies"></span>
          </button>

          <button
            type="button"
            class="nav-item"
            id="navApplications"
            data-section="applications"
            onclick="switchApplications()"
          >
            <span class="nav-icon" aria-hidden="true"
              ><svg width="15" height="15" viewBox="0 0 14 14">
                <path
                  d="M1.5 3.5h11v7.5a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"
                  fill="#B3262E"
                  opacity=".85"
                ></path>
                <path
                  d="M1.5 3.5L7 8l5.5-4.5"
                  fill="none"
                  stroke="#fff"
                  stroke-width="1.2"
                ></path></svg
            ></span>
            <span class="nav-label" data-i18n="tab_applications"
              >Applications</span
            >
          </button>
          <!-- No sub-items (post-ship fast fix): clicking Applications opens
               Triage directly. Applied stays reachable programmatically
               (palette, nav parent mapping) — see nav.js. -->

          <button
            type="button"
            class="nav-item"
            id="navBoards"
            data-section="boards"
            onclick="switchMode('boards')"
          >
            <span class="nav-icon" aria-hidden="true"
              ><svg width="15" height="15" viewBox="0 0 14 14">
                <rect
                  x="1.5"
                  y="7"
                  width="2.8"
                  height="5.5"
                  rx="1"
                  fill="#7C5CE0"
                  opacity=".55"
                ></rect>
                <rect
                  x="5.6"
                  y="4"
                  width="2.8"
                  height="8.5"
                  rx="1"
                  fill="#7C5CE0"
                  opacity=".75"
                ></rect>
                <rect
                  x="9.7"
                  y="1.5"
                  width="2.8"
                  height="11"
                  rx="1"
                  fill="#7C5CE0"
                ></rect></svg
            ></span>
            <span class="nav-label" data-i18n="tab_boards">Boards</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <button
            type="button"
            class="nav-item"
            id="navSettings"
            data-section="settings"
            onclick="switchMode('settings')"
          >
            <span class="nav-icon" aria-hidden="true"
              ><svg width="14" height="14" viewBox="0 0 14 14">
                <line
                  x1="2"
                  y1="4"
                  x2="12"
                  y2="4"
                  stroke="#8A867C"
                  stroke-width="1.4"
                ></line>
                <circle
                  cx="9"
                  cy="4"
                  r="1.9"
                  fill="#fff"
                  stroke="#8A867C"
                  stroke-width="1.4"
                ></circle>
                <line
                  x1="2"
                  y1="10"
                  x2="12"
                  y2="10"
                  stroke="#8A867C"
                  stroke-width="1.4"
                ></line>
                <circle
                  cx="5"
                  cy="10"
                  r="1.9"
                  fill="#fff"
                  stroke="#8A867C"
                  stroke-width="1.4"
                ></circle></svg
            ></span>
            <span class="nav-label" data-i18n="tab_settings">Settings</span>
          </button>
          <div class="sidebar-lang" id="sidebarLangHost"></div>
          <div class="sidebar-sync" id="sidebarSync">
            <span class="sync-dot" id="syncDot"></span>
            <span class="nav-label sync-label" id="syncLabel"></span>
          </div>
        </div>
      </aside>

      <div class="main-area">
        <div class="container">
          <!-- Fallback banner (DHA-422): only shown when boot() loaded the
               baked public/data.js because /api/vacancies wasn't reachable —
               see app.js's renderFallbackBanner / nav.js's fallbackBannerState. -->
          <div id="fallbackBanner" class="fallback-banner" hidden>
            <span class="fallback-banner-text" id="fallbackBannerText"></span>
            <button
              class="fallback-banner-dismiss"
              id="fallbackBannerDismiss"
              type="button"
              aria-label="Dismiss"
            >
              &times;
            </button>
          </div>
          <div id="syncIndicator" class="sync-indicator"></div>

          <!-- === VACANCIES SUB-NAV (Browse / Geo / Archive) ===
               Narrow widths (<900px) only: the sidebar's inline sub-items
               collapse with it, so this pill row takes over as the way to
               reach them while the Vacancies section is active. Hidden at
               desktop widths (style.css) where the sidebar shows them inline. -->
          <div class="vacancy-sub-nav" id="vacancySubNav">
            <button
              class="vacancy-sub-tab"
              id="vsubBrowse"
              onclick="switchMode('catalog')"
            >
              <span data-i18n="vsub_browse">Browse</span>
            </button>
            <button
              class="vacancy-sub-tab"
              id="vsubGeo"
              onclick="switchMode('stats')"
            >
              <span data-i18n="tab_geo">Geo</span>
            </button>
            <button
              class="vacancy-sub-tab"
              id="vsubArchive"
              onclick="switchMode('archive')"
            >
              <span data-i18n="tab_archive">Archive</span>
            </button>
          </div>

          <!-- Applications no longer has a sub-nav (post-ship fast fix):
               the sidebar item opens Triage directly, at every width. -->

          <!-- === TODAY MODE === -->
          <div class="today-section" id="todaySection"></div>
          <!-- /today-section -->

          <!-- === CATALOG MODE (Browse, dense rows — U5, DHA-389) === -->
          <div class="catalog-section active" id="catalogSection">
            <div class="catalog-loading" id="catalogLoading">
              <p class="loading-text" data-i18n="loading_vacancies">
                Sorting vacancies…
              </p>
            </div>

            <!-- Header on the material (design-protocol.md #6): title,
                 basket tabs, location pills, search + sort + show-all. -->
            <div class="browse-header">
              <span class="browse-title" data-i18n="vsub_browse">Browse</span>

              <div class="basket-tabs">
                <button
                  class="basket-tab"
                  data-basket="liked"
                  onclick="switchBasket(this)"
                >
                  <span data-i18n="basket_liked">Liked</span>
                  <span class="basket-count" id="countLiked">0</span>
                </button>
                <button
                  class="basket-tab active"
                  data-basket="unseen"
                  onclick="switchBasket(this)"
                >
                  <span data-i18n="basket_unreviewed">Unreviewed</span>
                  <span class="basket-count" id="countUnseen">0</span>
                </button>
                <button
                  class="basket-tab"
                  data-basket="passed"
                  onclick="switchBasket(this)"
                >
                  <span data-i18n="basket_passed">Passed</span>
                  <span class="basket-count" id="countPassed">0</span>
                </button>
              </div>

              <div class="browse-loc-chips">
                <button
                  class="browse-loc-chip"
                  data-cloc="europe"
                  onclick="toggleCatalogLoc(this)"
                  data-i18n="loc_europe"
                >
                  Europe
                </button>
                <button
                  class="browse-loc-chip"
                  data-cloc="remote"
                  onclick="toggleCatalogLoc(this)"
                  data-i18n="loc_remote"
                >
                  Remote
                </button>
                <button
                  class="browse-loc-chip"
                  data-cloc="other"
                  onclick="toggleCatalogLoc(this)"
                  data-i18n="loc_other"
                >
                  Other
                </button>
              </div>

              <div class="browse-header-right">
                <input
                  type="text"
                  class="browse-search"
                  id="catalogSearch"
                  placeholder="Search by title, organization, location..."
                  data-i18n-ph="search_vacancies_ph"
                  oninput="renderCatalog()"
                />
                <select
                  class="browse-org-filter"
                  id="catalogOrgFilter"
                  onchange="renderCatalog()"
                >
                  <option value="" data-i18n="all_companies">
                    All companies
                  </option>
                </select>
                <button
                  class="browse-sort-btn active"
                  onclick="toggleCatalogSort(this)"
                >
                  <span data-i18n="sort_score">Score</span>&#160;&#8595;
                </button>
                <button
                  class="browse-showall-btn"
                  onclick="toggleCatalogShowAll(this)"
                  data-i18n="catalog_show_all"
                >
                  Show all
                </button>
              </div>
            </div>

            <!-- Keyboard-triage affordance (U15, DHA-399; design-protocol #4 —
                 keep j/k/l/x/Enter visible). Keys are literal mono; the action
                 words go through i18n (EN in markup, RU baked). -->
            <div class="browse-keyhint">
              <span class="browse-key">j</span><span class="browse-key">k</span>
              <span class="browse-keyhint-label" data-i18n="keys_move"
                >move</span
              >
              <span class="browse-key">l</span>
              <span class="browse-keyhint-label" data-i18n="keys_like"
                >like</span
              >
              <span class="browse-key">x</span>
              <span class="browse-keyhint-label" data-i18n="keys_pass"
                >pass</span
              >
              <span class="browse-key">&#8629;</span>
              <span class="browse-keyhint-label" data-i18n="keys_open"
                >open</span
              >
            </div>

            <!-- Data as a sheet (design-protocol.md #2, #6). min-width guards
                 the scroll (AE4): below 920px the table scrolls inside the
                 sheet, never the page body. -->
            <div class="catalog-sheet">
              <div class="catalog-table">
                <div class="catalog-row-head">
                  <div data-i18n="browse_col_fit">Fit</div>
                  <div data-i18n="browse_col_role">Role</div>
                  <div data-i18n="browse_col_company">Company</div>
                  <div data-i18n="browse_col_location">Location</div>
                  <div data-i18n="browse_col_comp">Comp</div>
                  <div data-i18n="browse_col_seen">Seen</div>
                  <div></div>
                </div>
                <div class="browse-rows" id="catalogGrid"></div>
                <div
                  class="browse-results-count"
                  id="catalogResultsCount"
                ></div>
              </div>
            </div>
          </div>
          <!-- /catalog-section -->

          <!-- === COMPANIES MODE === -->
          <div class="companies-section" id="companiesSection">
            <div class="company-sub-tabs" id="companySubTabs">
              <button
                class="company-sub-tab active"
                data-subtab="approved"
                onclick="switchCompanySubTab('approved')"
                data-i18n="subtab_approved"
              >
                Approved
              </button>
              <button
                class="company-sub-tab"
                data-subtab="pending"
                onclick="switchCompanySubTab('pending')"
                data-i18n="subtab_pending"
              >
                Pending Review
              </button>
              <button
                class="company-sub-tab"
                data-subtab="archived"
                onclick="switchCompanySubTab('archived')"
                data-i18n="subtab_archived"
              >
                Archived
              </button>
            </div>
            <div class="companies-filters">
              <input
                type="text"
                class="catalog-search"
                id="companySearch"
                placeholder="Search by company, description, location..."
                data-i18n-ph="search_companies_ph"
                oninput="renderCompanies()"
              />
              <select
                class="catalog-org-filter"
                id="companyTierFilter"
                onchange="renderCompanies()"
              >
                <option value="" data-i18n="all_tiers">All tiers</option>
                <option value="S" data-i18n="tier_s">S — Strategic</option>
                <option value="A" data-i18n="tier_a">A — Strong Fit</option>
                <option value="B" data-i18n="tier_b">B — Monitor</option>
                <option value="C" data-i18n="tier_c">C — Low Priority</option>
                <option value="__unscored" data-i18n="tier_unscored">
                  — Unscored
                </option>
              </select>
              <div class="company-sort-chips">
                <button
                  class="chip chip-sort active"
                  data-csort="applyable"
                  onclick="toggleCompanySort(this)"
                >
                  <span data-i18n="csort_applyable">Applyable</span> &#8595;
                </button>
                <button
                  class="chip chip-sort"
                  data-csort="liked"
                  onclick="toggleCompanySort(this)"
                >
                  <span data-i18n="csort_liked">Liked</span>
                </button>
                <button
                  class="chip chip-sort"
                  data-csort="score"
                  onclick="toggleCompanySort(this)"
                  data-i18n="csort_score"
                >
                  Score
                </button>
                <button
                  class="chip chip-sort"
                  data-csort="interest"
                  onclick="toggleCompanySort(this)"
                  data-i18n="csort_interest"
                >
                  Interest
                </button>
              </div>
            </div>
            <div
              class="company-enrichment-stats"
              id="companyEnrichmentStats"
            ></div>
            <div class="ces-shown" id="companyShownCount"></div>
            <div class="companies-grid" id="companiesGrid"></div>
          </div>
          <!-- /companies-section -->

          <!-- === STATS MODE === -->
          <div class="stats-section" id="statsSection"></div>

          <!-- === ARCHIVE MODE === -->
          <div class="archive-section" id="archiveSection">
            <!-- Header on the material (design-protocol.md #6); rows sit in
                 the sheet below (U11, DHA-395). Illustrated-style images
                 retired (plan Key Decision: the illustration toggle is
                 gone). -->
            <div class="archive-header">
              <span class="archive-header-title" data-i18n="archive_title"
                >Vacancy archive</span
              >
              <select
                class="archive-org-filter"
                id="archiveOrgFilter"
                autocomplete="off"
                onchange="renderArchive()"
              >
                <option value="" data-i18n="all_companies">
                  All companies
                </option>
              </select>
              <input
                type="text"
                class="archive-search"
                id="archiveSearch"
                placeholder="Search by title, organization, location..."
                data-i18n-ph="search_vacancies_ph"
                oninput="renderArchive()"
              />
              <span class="archive-header-hint" data-i18n="archive_sub"
                >Vacancies archived from earlier runs. View only.</span
              >
            </div>
            <div class="archive-results-count" id="archiveResultsCount"></div>
            <div class="archive-sheet" id="archiveGrid"></div>
          </div>
          <!-- /archive-section -->

          <!-- === BOARDS MODE ===
           Header on the material (design-protocol.md #6); the table sits in
           the sheet below (U14, DHA-398). -->
          <div class="boards-section" id="boardsSection">
            <div class="boards-header">
              <span class="boards-header-title" data-i18n="boards_title"
                >Job boards</span
              >
              <span class="boards-header-sub" data-i18n="boards_sub"
                >The board catalogue, each board's enabled state, and
                freshness.</span
              >
            </div>
            <div class="boards-grid" id="boardsGrid"></div>
          </div>
          <!-- /boards-section -->

          <!-- === APPLICATIONS MODE ===
           Roles you've applied to, grouped by company. Rendered from the baked
           payload (groups[].application) — status + channel + date + artifact
           KEYS only, never private values. -->
          <div class="applications-section" id="applicationsSection"></div>
          <!-- /applications-section -->

          <!-- === PIPELINE MODE (Triage sub-tab under Applications) ===
           Used to be a sub-tab under Vacancies; moved here because triaging
           is the step that turns a liked vacancy into an application. -->
          <div class="pipeline-section" id="pipelineSection">
            <div class="triage-funnel" id="triageFunnel"></div>
            <div class="triage-board-controls" id="triageBoardControls"></div>
            <div class="pipeline-board" id="pipelineBoard"></div>
          </div>
          <!-- /pipeline-section -->

          <!-- === SETTINGS MODE ===
           Read-only display of the RESOLVED dials baked by the generator
           (volume, scoring model tier, thresholds), each with the one line to
           change it. No editing UI. Header + grouped rows are rendered by
           settings.js (U14, DHA-398). -->
          <div class="settings-section" id="settingsSection"></div>
          <!-- /settings-section -->

          <!-- === COMPANY PROFILE PAGE === -->
          <div class="company-profile-page" id="companyProfile"></div>

          <!-- === VACANCY DETAIL PAGE (routed, ?vacancy=<group-id>) ===
           U4 wires the routing + a fixed placeholder here; U6 replaces the
           placeholder with the real page (public/modules/vacancy.js). Layered
           over the section lists like the company profile above. -->
          <div class="vacancy-detail-page" id="vacancyDetail"></div>
        </div>
      </div>
    </div>

    <!-- bootstrap.js fetches /api/vacancies (live, full mode), falls back to a
         static data.js (simple/local mode), then imports app.js. It populates
         window.VACANCY_DATA before the app's module graph loads. -->
    <script type="module" src="modules/bootstrap.js"></script>
  </body>
</html>
