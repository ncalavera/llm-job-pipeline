<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Vacancy Dashboard</title>
    <link

    />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="top-nav">
      <div class="top-nav-brand">Job Search Pipeline</div>
      <div class="mode-toggle">
        <button
          class="mode-btn"
          id="modeCompanies"
          onclick="switchMode('companies')"
        >
          &#9881; <span data-i18n="tab_companies">Companies</span>
        </button>
        <button
          class="mode-btn"
          id="modeCatalog"
          onclick="switchMode('catalog')"
        >
          &#9636; <span data-i18n="tab_vacancies">Vacancies</span>
        </button>
        <button
          class="mode-btn"
          id="modePipeline"
          onclick="switchMode('pipeline')"
        >
          &#9654; <span data-i18n="tab_triage">Triage</span>
        </button>
        <button class="mode-btn" id="modeStats" onclick="switchMode('stats')">
          &#128205; <span data-i18n="tab_geo">Geo</span>
        </button>
        <button
          class="mode-btn"
          id="modeArchive"
          onclick="switchMode('archive')"
        >
          &#128230; <span data-i18n="tab_archive">Archive</span>
        </button>
        <button class="mode-btn" id="modeBoards" onclick="switchMode('boards')">
          &#128202; <span data-i18n="tab_boards">Boards</span>
        </button>
      </div>
      <div class="top-nav-right">
        <span class="hero-date" id="heroDate"></span>
      </div>
    </nav>

    <div class="container">
      <div id="syncIndicator" class="sync-indicator"></div>

      <!-- === CATALOG MODE === -->
      <div class="catalog-section active" id="catalogSection">
        <div class="catalog-loading" id="catalogLoading">
          <img
            src="images/illus-catalog.png"
            data-img="illus-catalog"
            alt="Illustration of a figure reviewing job listings"
            class="loading-illus"
          />
          <p class="loading-text" data-i18n="loading_vacancies">
            Sorting vacancies…
          </p>
        </div>

        <div class="gf-companion">
          <img
            src="images/illus-catalog.png"
            data-img="illus-catalog"
            alt="Illustration of a figure reviewing job listings"
          />
        </div>
        <div class="gf-accent">
          <img
            src="images/accent-catalog.png"
            data-img="accent-catalog"
            alt=""
          />
        </div>

        <div class="basket-tabs">
          <button
            class="basket-tab"
            data-basket="liked"
            onclick="switchBasket(this)"
          >
            <span class="basket-dot"></span>
            <span data-i18n="basket_liked">Liked</span>
            <span class="basket-count" id="countLiked">0</span>
          </button>
          <button
            class="basket-tab active"
            data-basket="unseen"
            onclick="switchBasket(this)"
          >
            <span class="basket-dot"></span>
            <span data-i18n="basket_unreviewed">Unreviewed</span>
            <span class="basket-count" id="countUnseen">0</span>
          </button>
          <button
            class="basket-tab"
            data-basket="passed"
            onclick="switchBasket(this)"
          >
            <span class="basket-dot"></span>
            <span data-i18n="basket_passed">Passed</span>
            <span class="basket-count" id="countPassed">0</span>
          </button>
        </div>

        <div class="catalog-filters">
          <input
            type="text"
            class="catalog-search"
            id="catalogSearch"
            placeholder="Search by title, organization, location..."
            data-i18n-ph="search_vacancies_ph"
            oninput="renderCatalog()"
          />
          <select
            class="catalog-org-filter"
            id="catalogOrgFilter"
            onchange="renderCatalog()"
          >
            <option value="" data-i18n="all_companies">All companies</option>
          </select>
          <div class="catalog-loc-chips">
            <button
              class="chip"
              data-cloc="europe"
              onclick="toggleCatalogLoc(this)"
              data-i18n="loc_europe"
            >
              Europe
            </button>
            <button
              class="chip"
              data-cloc="us"
              onclick="toggleCatalogLoc(this)"
              data-i18n="loc_us"
            >
              US
            </button>
            <button
              class="chip"
              data-cloc="remote"
              onclick="toggleCatalogLoc(this)"
              data-i18n="loc_remote"
            >
              Remote
            </button>
            <button
              class="chip"
              data-cloc="other"
              onclick="toggleCatalogLoc(this)"
              data-i18n="loc_other"
            >
              Other
            </button>
          </div>
          <button
            class="chip catalog-sort-btn active"
            onclick="toggleCatalogSort(this)"
          >
            <span data-i18n="sort_score">Score</span>&#160;&#8595;
          </button>
        </div>

        <div class="catalog-results-count" id="catalogResultsCount"></div>
        <div class="catalog-grid" id="catalogGrid"></div>
      </div>
      <!-- /catalog-section -->

      <!-- === COMPANIES MODE === -->
      <div class="companies-section" id="companiesSection">
        <div class="gf-companion">
          <img
            src="images/illus-companies.png"
            data-img="illus-companies"
            alt="Illustration of companies being reviewed"
          />
        </div>
        <div class="gf-accent">
          <img
            src="images/accent-companies.png"
            data-img="accent-companies"
            alt=""
          />
        </div>
        <div class="company-sub-tabs" id="companySubTabs">
          <button
            class="company-sub-tab active"
            data-subtab="approved"
            onclick="switchCompanySubTab('approved')"
            data-i18n="subtab_approved"
          >
            Approved
          </button>
          <button
            class="company-sub-tab"
            data-subtab="pending"
            onclick="switchCompanySubTab('pending')"
            data-i18n="subtab_pending"
          >
            Pending Review
          </button>
          <button
            class="company-sub-tab"
            data-subtab="archived"
            onclick="switchCompanySubTab('archived')"
            data-i18n="subtab_archived"
          >
            Archived
          </button>
        </div>
        <div class="companies-filters">
          <input
            type="text"
            class="catalog-search"
            id="companySearch"
            placeholder="Search by company, description, location..."
            data-i18n-ph="search_companies_ph"
            oninput="renderCompanies()"
          />
          <select
            class="catalog-org-filter"
            id="companyTierFilter"
            onchange="renderCompanies()"
          >
            <option value="" data-i18n="all_tiers">All tiers</option>
            <option value="S" data-i18n="tier_s">S — Strategic</option>
            <option value="A" data-i18n="tier_a">A — Strong Fit</option>
            <option value="B" data-i18n="tier_b">B — Monitor</option>
            <option value="C" data-i18n="tier_c">C — Low Priority</option>
            <option value="__unscored" data-i18n="tier_unscored">
              — Unscored
            </option>
          </select>
          <div class="company-sort-chips">
            <button
              class="chip chip-sort active"
              data-csort="applyable"
              onclick="toggleCompanySort(this)"
            >
              <span data-i18n="csort_applyable">Годные</span> &#8595;
            </button>
            <button
              class="chip chip-sort"
              data-csort="liked"
              onclick="toggleCompanySort(this)"
            >
              <span data-i18n="csort_liked">Liked</span>
            </button>
            <button
              class="chip chip-sort"
              data-csort="score"
              onclick="toggleCompanySort(this)"
              data-i18n="csort_score"
            >
              Score
            </button>
            <button
              class="chip chip-sort"
              data-csort="interest"
              onclick="toggleCompanySort(this)"
              data-i18n="csort_interest"
            >
              Interest
            </button>
          </div>
        </div>
        <div class="company-enrichment-stats" id="companyEnrichmentStats"></div>
        <div class="ces-shown" id="companyShownCount"></div>
        <div class="companies-grid" id="companiesGrid"></div>
      </div>
      <!-- /companies-section -->

      <!-- === PIPELINE MODE === -->
      <div class="pipeline-section" id="pipelineSection">
        <div class="gf-companion">
          <img
            src="images/illus-pipeline.png"
            data-img="illus-pipeline"
            alt="Illustration of the triage pipeline"
          />
        </div>
        <div class="gf-accent">
          <img
            src="images/accent-pipeline.png"
            data-img="accent-pipeline"
            alt=""
          />
        </div>
        <div class="triage-funnel" id="triageFunnel"></div>
        <div class="triage-board-controls" id="triageBoardControls"></div>
        <div class="pipeline-board" id="pipelineBoard"></div>
      </div>

      <!-- === STATS MODE === -->
      <div class="stats-section" id="statsSection"></div>

      <!-- === ARCHIVE MODE === -->
      <div class="archive-section" id="archiveSection">
        <div class="gf-companion">
          <img
            src="images/illus-archive.png"
            data-img="illus-archive"
            alt="Illustration of the vacancy archive"
          />
        </div>
        <div class="gf-accent">
          <img
            src="images/accent-archive.png"
            data-img="accent-archive"
            alt=""
          />
        </div>
        <div class="archive-intro">
          <h2 class="archive-title">
            &#128230; <span data-i18n="archive_title">Vacancy archive</span>
          </h2>
          <p class="archive-sub" data-i18n="archive_sub">
            Vacancies archived from earlier runs. View only.
          </p>
        </div>
        <div class="catalog-filters">
          <input
            type="text"
            class="catalog-search"
            id="archiveSearch"
            placeholder="Search by title, organization, location..."
            data-i18n-ph="search_vacancies_ph"
            oninput="renderArchive()"
          />
          <select
            class="catalog-org-filter"
            id="archiveOrgFilter"
            onchange="renderArchive()"
          >
            <option value="" data-i18n="all_companies">All companies</option>
          </select>
        </div>
        <div class="catalog-results-count" id="archiveResultsCount"></div>
        <div class="catalog-grid" id="archiveGrid"></div>
      </div>
      <!-- /archive-section -->

      <!-- === BOARDS MODE === -->
      <div class="boards-section" id="boardsSection">
        <div class="boards-intro">
          <h2 class="boards-title">
            &#128202; <span data-i18n="boards_title">Job boards</span>
          </h2>
          <p class="boards-sub" data-i18n="boards_sub">
            Live status of the aggregators feeding the pipeline.
          </p>
        </div>
        <div class="boards-grid" id="boardsGrid"></div>
      </div>
      <!-- /boards-section -->

      <!-- === COMPANY PROFILE PAGE === -->
      <div class="company-profile-page" id="companyProfile"></div>
    </div>

    <!-- bootstrap.js fetches /api/vacancies (live, full mode), falls back to a
         static data.js (simple/local mode), then imports app.js. It populates
         window.VACANCY_DATA before the app's module graph loads. -->
    <script type="module" src="modules/bootstrap.js"></script>
  </body>
</html>
