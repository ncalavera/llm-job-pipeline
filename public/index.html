<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="top-nav">
      <div class="top-nav-brand">Job Search 2026</div>
      <div class="mode-toggle">
        <button
          class="mode-btn"
          id="modeCompanies"
          onclick="switchMode('companies')"
        >
          &#9881; Companies
        </button>
        <button
          class="mode-btn"
          id="modeCatalog"
          onclick="switchMode('catalog')"
        >
          &#9636; Vacancies
        </button>
        <button
          class="mode-btn"
          id="modePipeline"
          onclick="switchMode('pipeline')"
        >
          &#9654; Triage
        </button>
        <button class="mode-btn" id="modeStats" onclick="switchMode('stats')">
          &#128205; Geo
        </button>
        <button
          class="mode-btn"
          id="modeArchive"
          onclick="switchMode('archive')"
        >
          &#128230; Archive
        </button>
      </div>
      <div class="top-nav-right">
        <span class="hero-date" id="heroDate"></span>
      </div>
    </nav>

    <div class="container">
      <div id="syncIndicator" class="sync-indicator"></div>

      <!-- === CATALOG MODE === -->
      <div class="catalog-section active" id="catalogSection">
        <div class="catalog-loading" id="catalogLoading">
          <img
            src="images/illus-catalog.png"
            alt="Manny reviews vacancies"
            class="loading-manny"
          />
          <p class="loading-text">Clayman is sorting vacancies…</p>
        </div>

        <div class="gf-companion">
          <img src="images/illus-catalog.png" alt="Manny reviews vacancies" />
        </div>
        <div class="gf-accent">
          <img src="images/accent-catalog.png" alt="" />
        </div>

        <div class="basket-tabs">
          <button
            class="basket-tab"
            data-basket="liked"
            onclick="switchBasket(this)"
          >
            <span class="basket-dot"></span>
            Liked
            <span class="basket-count" id="countLiked">0</span>
          </button>
          <button
            class="basket-tab active"
            data-basket="unseen"
            onclick="switchBasket(this)"
          >
            <span class="basket-dot"></span>
            Unreviewed
            <span class="basket-count" id="countUnseen">0</span>
          </button>
          <button
            class="basket-tab"
            data-basket="passed"
            onclick="switchBasket(this)"
          >
            <span class="basket-dot"></span>
            Passed
            <span class="basket-count" id="countPassed">0</span>
          </button>
        </div>

        <div class="catalog-filters">
          <input
            type="text"
            class="catalog-search"
            id="catalogSearch"
            placeholder="Search by title, organization, location..."
            oninput="renderCatalog()"
          />
          <select
            class="catalog-org-filter"
            id="catalogOrgFilter"
            onchange="renderCatalog()"
          >
            <option value="">All companies</option>
          </select>
          <div class="catalog-loc-chips">
            <button
              class="chip"
              data-cloc="europe"
              onclick="toggleCatalogLoc(this)"
            >
              Europe
            </button>
            <button
              class="chip"
              data-cloc="us"
              onclick="toggleCatalogLoc(this)"
            >
              US
            </button>
            <button
              class="chip"
              data-cloc="remote"
              onclick="toggleCatalogLoc(this)"
            >
              Remote
            </button>
            <button
              class="chip"
              data-cloc="other"
              onclick="toggleCatalogLoc(this)"
            >
              Other
            </button>
          </div>
          <button
            class="chip catalog-sort-btn active"
            onclick="toggleCatalogSort(this)"
          >
            Score&#160;&#8595;
          </button>
        </div>

        <div class="catalog-results-count" id="catalogResultsCount"></div>
        <div class="catalog-grid" id="catalogGrid"></div>
      </div>
      <!-- /catalog-section -->

      <!-- === COMPANIES MODE === -->
      <div class="companies-section" id="companiesSection">
        <div class="gf-companion">
          <img
            src="images/illus-companies.png"
            alt="Glottis tunes the engine"
          />
        </div>
        <div class="gf-accent">
          <img src="images/accent-companies.png" alt="" />
        </div>
        <div class="company-sub-tabs" id="companySubTabs">
          <button
            class="company-sub-tab active"
            data-subtab="approved"
            onclick="switchCompanySubTab('approved')"
          >
            Approved
          </button>
          <button
            class="company-sub-tab"
            data-subtab="pending"
            onclick="switchCompanySubTab('pending')"
          >
            Pending Review
          </button>
          <button
            class="company-sub-tab"
            data-subtab="archived"
            onclick="switchCompanySubTab('archived')"
          >
            Archived
          </button>
        </div>
        <div class="companies-filters">
          <input
            type="text"
            class="catalog-search"
            id="companySearch"
            placeholder="Search by company, description, location..."
            oninput="renderCompanies()"
          />
          <select
            class="catalog-org-filter"
            id="companyTierFilter"
            onchange="renderCompanies()"
          >
            <option value="">All tiers</option>
            <option value="S">S — Strategic</option>
            <option value="A">A — Strong Fit</option>
            <option value="B">B — Monitor</option>
            <option value="C">C — Low Priority</option>
            <option value="__unscored">— Unscored</option>
          </select>
          <div class="company-sort-chips">
            <button
              class="chip chip-sort active"
              data-csort="liked"
              onclick="toggleCompanySort(this)"
            >
              Liked &#8595;
            </button>
            <button
              class="chip chip-sort"
              data-csort="score"
              onclick="toggleCompanySort(this)"
            >
              Score
            </button>
            <button
              class="chip chip-sort"
              data-csort="interest"
              onclick="toggleCompanySort(this)"
            >
              Interest
            </button>
          </div>
        </div>
        <div class="company-enrichment-stats" id="companyEnrichmentStats"></div>
        <div class="ces-shown" id="companyShownCount"></div>
        <div class="companies-grid" id="companiesGrid"></div>
      </div>
      <!-- /companies-section -->

      <!-- === PIPELINE MODE === -->
      <div class="pipeline-section" id="pipelineSection">
        <div class="gf-companion">
          <img src="images/illus-pipeline.png" alt="Number Nine Express" />
        </div>
        <div class="gf-accent">
          <img src="images/accent-pipeline.png" alt="" />
        </div>
        <div class="triage-funnel" id="triageFunnel"></div>
        <div class="triage-board-controls" id="triageBoardControls"></div>
        <div class="pipeline-board" id="pipelineBoard"></div>
      </div>

      <!-- === STATS MODE === -->
      <div class="stats-section" id="statsSection"></div>

      <!-- === ARCHIVE MODE === -->
      <div class="archive-section" id="archiveSection">
        <div class="gf-companion">
          <img src="images/illus-archive.png" alt="Clayman at the archive" />
        </div>
        <div class="gf-accent">
          <img src="images/accent-archive.png" alt="" />
        </div>
        <div class="archive-intro">
          <h2 class="archive-title">&#128230; Vacancy archive</h2>
          <p class="archive-sub">
            Older vacancies from before the search restart. View only.
          </p>
        </div>
        <div class="catalog-filters">
          <input
            type="text"
            class="catalog-search"
            id="archiveSearch"
            placeholder="Search by title, organization, location..."
            oninput="renderArchive()"
          />
          <select
            class="catalog-org-filter"
            id="archiveOrgFilter"
            onchange="renderArchive()"
          >
            <option value="">All companies</option>
          </select>
        </div>
        <div class="catalog-results-count" id="archiveResultsCount"></div>
        <div class="catalog-grid" id="archiveGrid"></div>
      </div>
      <!-- /archive-section -->

      <!-- === COMPANY PROFILE PAGE === -->
      <div class="company-profile-page" id="companyProfile"></div>
    </div>

    <script src="data.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
