<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Materials · JobSearch</title>

:root{color-scheme:light dark;font-family:system-ui,sans-serif;background:light-dark(#f6f5f2,#191919);color:light-dark(#242424,#eee)}body{max-width:1050px;margin:0 auto;padding:28px 20px}a{color:light-dark(#2545d3,#aabaff)}h1{margin-bottom:8px}p{line-height:1.5;color:light-dark(#555,#bbb)}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select{font:inherit;padding:10px;border:1px solid #888;border-radius:6px}input{flex:1;min-width:180px}.group{margin:28px 0}.card{border:1px solid light-dark(#ddd,#555);border-radius:8px;padding:16px;margin:10px 0;background:light-dark(white,#222)}summary{cursor:pointer;line-height:1.6}.meta{font-size:13px;color:light-dark(#555,#bbb);margin:8px 0}.badge{display:inline-block;border-radius:4px;background:light-dark(#eaeaea,#383838);padding:2px 7px;font-size:12px;margin-left:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 system-ui;max-height:500px;overflow:auto}.source{overflow-wrap:anywhere;font-size:12px}label{display:flex;flex-direction:column;gap:5px;font-size:13px}button{font:inherit;padding:8px;cursor:pointer}

<a href="/">← JobSearch</a><h1>Materials</h1>
<p>Your CVs, letters, answers and career evidence. Earlier versions stay available.<br><strong>Sent</strong> means submission evidence exists. <strong>Draft</strong> is explicitly unfinished. <strong>Unconfirmed</strong> means we cannot establish whether this exact version was sent.</p>
<div class="filters"><label style="flex:1">Search materials<input id="search" type="search" placeholder="A company, question, skill or career example…"></label><label>Submission<select id="status"><option value="">All</option><option value="sent">Sent</option><option value="draft">Draft</option><option value="unknown">Unconfirmed</option></select></label><label>Type<select id="kind"><option value="">All</option><option value="cv">CV</option><option value="cover_letter">Cover letter</option><option value="answers">Answers</option><option value="test">Test response</option><option value="evidence">Career evidence</option><option value="notes">Notes & correspondence</option></select></label></div>
<p id="count" role="status">Loading materials…</p><main id="list"></main><script type="module" src="/modules/materials.js"></script></body></html>
